# Production overlay: run WITH the base file, e.g.
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Adds a Caddy reverse proxy that terminates HTTPS on your domain and forwards
# to the frontend. Only 80/443 are public; everything else stays on the internal
# compose network.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
