[project]
name = "fiche-schema"
version = "0.1.0"
description = "Canonical Pydantic schema for the Agilink Fiche Suiveuse extraction pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fiche_schema*"]
