services:
  postgres:
    image: postgres:16
    container_name: agilink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host 5434 — this dev machine already runs a native postgres on 5432.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host 6380 — this machine has another, unrelated docker daemon (a
      # snap-installed Docker, separate from Docker Desktop which this
      # compose project uses) with stray containers already bound to 6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$MINIO_BUCKET &&
      echo 'bucket ready'
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"   # the Agilink Fiches Suiveuses web app → http://localhost:3000

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    # Local drop-folder auto-ingest: host ./inbox is where you drop scans; the
    # worker reads + moves them (to ./inbox/processed). Set LOCAL_INBOX_ENABLED=1.
    volumes:
      - ./inbox:/srv/inbox
    depends_on:
      redis:
        condition: service_healthy

  # Celery beat scheduler — drives the auto-ingest pollers on a timer
  # (SharePoint and/or the local inbox). Same image as the worker, just the beat
  # process. Single instance only. No-op when both pollers are disabled.
  beat:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=info"]
    volumes:
      - ./inbox:/srv/inbox
    depends_on:
      redis:
        condition: service_healthy

  # On-prem production VLM: self-hosted, fully open-source Qwen2.5-VL served by
  # vLLM over an OpenAI-compatible API. Nothing leaves the premises. Gated
  # behind the "gpu" compose profile so the default (POC) stack doesn't try to
  # start it on machines without an NVIDIA GPU:
  #   docker compose --profile gpu up -d        # start everything incl. vLLM
  # and set VLM_BACKEND=vllm in .env to route extraction here instead of Groq.
  # Requires the host to have an NVIDIA GPU + nvidia-container-toolkit. The
  # 7B model needs ~18-20GB VRAM; drop to Qwen2.5-VL-3B for ~10GB, or raise to
  # 32B/72B on bigger cards (set VLLM_MODEL to match). First start downloads
  # the weights from Hugging Face into the hf_cache volume (a few minutes).
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    restart: unless-stopped
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      --served-model-name ${VLLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      --max-model-len 8192
      --limit-mm-per-prompt image=1
      --gpu-memory-utilization 0.92
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8001:8000"  # host 8001 — the api already publishes 8000
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s  # weights download + model load can take minutes

volumes:
  postgres_data:
    name: agilink_postgres_data
  minio_data:
  hf_cache:  # caches downloaded Qwen2.5-VL weights across restarts
