[project]
name = "agilink-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4,<6",
    "pymupdf>=1.24,<2",
    "openpyxl>=3.1,<4",   # Excel export
    "fpdf2>=2.7,<3",      # PDF export
    "openai>=1.40,<2",    # chatbot (text-to-SQL via OpenRouter)
]
# fiche-schema is installed separately as a local editable package
# (see ../packages/fiche_schema) — not declared here since it isn't published
# to an index; both Dockerfile and dev setup install it as a sibling step.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
]
