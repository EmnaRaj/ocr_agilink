server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed assets aggressively; never cache the entry HTML.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA client-side routing: any unknown path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + scan images are proxied to the FastAPI service on the compose network.
    # The "/api" prefix is stripped so /api/stats → http://api:8000/stats.
    # Use Docker's embedded DNS (127.0.0.11) via a variable upstream so nginx
    # RE-RESOLVES the api hostname per request — otherwise it caches the api
    # container's IP at startup and 502s the moment api is recreated.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25m;   # scans can be a few MB
        proxy_read_timeout 300s;    # extraction (row/section calls) can take ~70s
        proxy_buffering off;        # stream the chatbot answer token-by-token
    }
}
